name: Flatpak

# Builds a Flatpak bundle from the manifest and attaches it to the release.
# Users then: flatpak install --user paint.software.flatpak
on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # attach the bundle to the Release

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: paint.software.flatpak
          manifest-path: packaging/io.github.univers4craft.PaintSoftware.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Upload the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: paint.software.flatpak

  # Attaching runs on the normal runner, not the SDK container: it has git and gh,
  # and no "dubious ownership" issue (the runner user owns the checkout).
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for the version (commit count)

      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MM=$(grep -oP 'project\(PaintDali VERSION \K[0-9]+\.[0-9]+' CMakeLists.txt)
          TAG="v${MM}.$(git rev-list --count HEAD)"
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" paint.software.flatpak --clobber
              echo "Uploaded paint.software.flatpak to $TAG"
              exit 0
            fi
            echo "Waiting for release $TAG… ($i)"
            sleep 10
          done
          echo "Release $TAG never appeared; the bundle is in the workflow artifacts."
