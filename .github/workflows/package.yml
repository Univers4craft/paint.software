name: Package (.deb)

# Builds a Debian package. On a version tag (v*) it publishes the .deb on the
# GitHub Release; on a manual run it uploads the .deb as a downloadable artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the .deb to a Release

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-image-formats-plugins libgl1-mesa-dev file

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Build .deb
        run: |
          cd build && cpack -G DEB
          cd .. && for deb in build/*.deb; do packaging/deb-add-debian-alternatives.sh "$deb"; done

      - name: Show package info
        run: dpkg-deb -I build/*.deb

      - name: Upload .deb as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: paint.software-deb
          path: build/*.deb

      - name: Attach .deb to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
