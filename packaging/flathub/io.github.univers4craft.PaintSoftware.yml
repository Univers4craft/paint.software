# Flathub submission manifest. Unlike packaging/io.github.univers4craft.PaintSoftware.yml
# (which tracks main for our own .flatpak bundle), Flathub requires a PINNED
# source — a tag and its commit. Bump `tag` + `commit` for each Flathub release.
app-id: io.github.univers4craft.PaintSoftware
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: paintdotnet

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  - name: paint.software
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/Univers4craft/paint.software.git
        tag: v1.1.44
        commit: 53a809bd1c1dc44050fe8dc4adeeb5257b8f950c
        # x-checker-data lets Flathub's bot propose updates when a new tag lands.
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
    post-install:
      - install -Dm644 packaging/io.github.univers4craft.PaintSoftware.metainfo.xml
          /app/share/metainfo/io.github.univers4craft.PaintSoftware.metainfo.xml
      - mv /app/share/applications/paint.software.desktop
          /app/share/applications/io.github.univers4craft.PaintSoftware.desktop
      - desktop-file-edit --set-icon=io.github.univers4craft.PaintSoftware
          /app/share/applications/io.github.univers4craft.PaintSoftware.desktop
      - install -Dm644 src/resources/paintdali-logo.png
          /app/share/icons/hicolor/256x256/apps/io.github.univers4craft.PaintSoftware.png
