name: CI

# Builds the app and runs the test suite on every push and pull request,
# so any change (including outside contributors' PRs) is verified automatically.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build application
        run: cmake --build build -j

      - name: Build tests
        run: cmake --build build --target paintdotnet_tests -j

      - name: Run tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/paintdotnet_tests
